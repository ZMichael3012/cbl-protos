syntax = "proto3";

package billing.connector.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/connector/v1;connectorv1";

// CanonicalPaymentStatusValue describes the canonical payment status at the provider.
enum CanonicalPaymentStatusValue {
  CANONICAL_PAYMENT_STATUS_VALUE_UNSPECIFIED = 0;
  CANONICAL_PAYMENT_STATUS_VALUE_DETECTED = 1;
  CANONICAL_PAYMENT_STATUS_VALUE_CONFIRMED = 2;
  CANONICAL_PAYMENT_STATUS_VALUE_FAILED = 3;
  CANONICAL_PAYMENT_STATUS_VALUE_EXPIRED = 4;
  CANONICAL_PAYMENT_STATUS_VALUE_UNDERPAID = 5;
  CANONICAL_PAYMENT_STATUS_VALUE_OVERPAID = 6;
}

// CanonicalPaymentStatus describes the payment status in the unified platform model.
message CanonicalPaymentStatus {
  string payment_id = 1;
  string gateway_id = 2;
  string provider = 3;
  CanonicalPaymentStatusValue status = 4;
  billing.common.v1.Money received_amount = 5;
  uint32 confirmations = 6;
  string txid = 7;
  string network = 8;
  google.protobuf.Timestamp gateway_event_ts = 9;
}

// Capability describes provider capabilities per network and asset.
message Capability {
  string network = 1;
  string asset = 2;
  billing.common.v1.Money min_amount = 3;
  uint32 confirmation_depth = 4;
}

// CreateInvoiceRequest creates an invoice in the external gateway.
message CreateInvoiceRequest {
  string idempotency_key = 1;
  string payment_id = 2;
  billing.common.v1.Money amount = 3;
  string asset = 4;
  string network = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// CreateInvoiceResponse returns the payment details from the gateway.
message CreateInvoiceResponse {
  string gateway_invoice_id = 1;
  string provider = 2;
  string address = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// GetGatewayPaymentRequest re-checks the payment status at the gateway.
message GetGatewayPaymentRequest {
  string provider = 1;
  string gateway_id = 2;
}

// GetGatewayPaymentResponse returns the canonical status.
message GetGatewayPaymentResponse {
  CanonicalPaymentStatus payment = 1;
}

// ListGatewayPaymentsRequest lists gateway operations for reconciliation.
message ListGatewayPaymentsRequest {
  string provider = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  uint32 limit = 4;
  string cursor = 5;
}

// ListGatewayPaymentsResponse returns a page of gateway operations.
message ListGatewayPaymentsResponse {
  repeated CanonicalPaymentStatus payments = 1;
  string next_cursor = 2;
}

// GetCapabilitiesRequest requests provider capabilities.
message GetCapabilitiesRequest {}

// GetCapabilitiesResponse returns the capability list.
message GetCapabilitiesResponse {
  repeated Capability capabilities = 1;
}

// RoutingRuleAdmin describes one provider routing rule for the administrative
// contour (CBL-12.2); the form matches GET/PUT /admin/v1/routing-rules.
message RoutingRuleAdmin {
  string provider = 1;
  // operation limits the rule to one operation: "" - any, invoice, payout.
  string operation = 2;
  repeated string networks = 3;
  repeated string assets = 4;
  // priority orders the rules, lower is more important.
  int32 priority = 5;
  // weight distributes traffic within one priority.
  int32 weight = 6;
  // min_amount and max_amount bound the rule in minor units of the asset;
  // 0 means no bound.
  int64 min_amount = 7;
  int64 max_amount = 8;
  bool enabled = 9;
}

// GetRoutingRulesRequest requests the current routing configuration.
message GetRoutingRulesRequest {}

// GetRoutingRulesResponse returns the current configuration revision and all rules.
message GetRoutingRulesResponse {
  int64 revision = 1;
  repeated RoutingRuleAdmin items = 2;
}

// PutRoutingRulesRequest replaces the whole routing configuration; revision is
// the value from the last GET (optimistic concurrency, a mismatch is FailedPrecondition).
message PutRoutingRulesRequest {
  int64 revision = 1;
  repeated RoutingRuleAdmin items = 2;
}

// PutRoutingRulesResponse returns the stored revision and rules.
message PutRoutingRulesResponse {
  int64 revision = 1;
  repeated RoutingRuleAdmin items = 2;
}

// DisableProviderRequest disables a provider manually.
message DisableProviderRequest {
  string provider = 1;
  // reason is an optional operator comment.
  string reason = 2;
}

// DisableProviderResponse reports whether the provider was already disabled.
message DisableProviderResponse {
  bool already_disabled = 1;
}

// ConnectorAdminService is the administrative contour of the connector
// (CBL-12.2): the routing configuration source of truth and the manual provider
// disable. It is a separate service so the money-path ConnectorService server
// interface and its fakes stay source-compatible.
service ConnectorAdminService {
  rpc GetRoutingRules(GetRoutingRulesRequest) returns (GetRoutingRulesResponse);
  rpc PutRoutingRules(PutRoutingRulesRequest) returns (PutRoutingRulesResponse);
  rpc DisableProvider(DisableProviderRequest) returns (DisableProviderResponse);
}

// ConnectorService abstracts external crypto gateways.
service ConnectorService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  rpc GetGatewayPayment(GetGatewayPaymentRequest) returns (GetGatewayPaymentResponse);
  rpc ListGatewayPayments(ListGatewayPaymentsRequest) returns (ListGatewayPaymentsResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}
