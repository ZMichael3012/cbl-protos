syntax = "proto3";

package billing.payout.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/payout/v1;payoutv1";

// PayoutState describes payout state machine states.
enum PayoutState {
  PAYOUT_STATE_UNSPECIFIED = 0;
  PAYOUT_STATE_REQUESTED = 1;
  PAYOUT_STATE_APPROVED = 2;
  PAYOUT_STATE_RESERVED = 3;
  PAYOUT_STATE_SENT_TO_GATEWAY = 4;
  PAYOUT_STATE_COMPLETED = 5;
  PAYOUT_STATE_FAILED = 6;
  PAYOUT_STATE_COMPENSATED = 7;
  PAYOUT_STATE_REJECTED = 8;
}

// Payout describes a payout and its current state.
message Payout {
  string payout_id = 1;
  string merchant_id = 2;
  PayoutState state = 3;
  billing.common.v1.Money amount = 4;
  billing.common.v1.Money fee = 5;
  string network = 6;
  string destination_address = 7;
  string txid = 8;
  string failure_reason = 9;
  uint64 state_version = 10;
  google.protobuf.Timestamp created_at = 11;
  // RefundInvoiceId specifies the source refund invoice: a non-empty value
  // means the payout is a refund (CBL-000, section 5).
  string refund_invoice_id = 12;
}

// CreatePayoutRequest creates a payout request.
message CreatePayoutRequest {
  string idempotency_key = 1;
  string merchant_id = 2;
  billing.common.v1.Money amount = 3;
  string network = 4;
  string destination_address = 5;
  string merchant_ref = 6;
  // RefundInvoiceId specifies the source refund invoice (CBL-003, section 2):
  // a non-empty value creates a refund through the same saga; the amount not
  // exceeding the refundable account balance is checked by the Billing API (7.x).
  string refund_invoice_id = 7;
}

// CreatePayoutResponse returns the created payout request.
message CreatePayoutResponse {
  string payout_id = 1;
  PayoutState state = 2;
}

// ApprovePayoutRequest approves or rejects a large payout.
message ApprovePayoutRequest {
  string payout_id = 1;
  string operator_id = 2;
  bool approve = 3;
  string reason = 4;
}

// ApprovePayoutResponse returns the payout state.
message ApprovePayoutResponse {
  Payout payout = 1;
}

// GetPayoutRequest requests a payout by identifier.
message GetPayoutRequest {
  string payout_id = 1;
}

// GetPayoutResponse returns the payout.
message GetPayoutResponse {
  Payout payout = 1;
}

// PayoutService manages the payout and refund saga.
service PayoutService {
  rpc CreatePayout(CreatePayoutRequest) returns (CreatePayoutResponse);
  rpc ApprovePayout(ApprovePayoutRequest) returns (ApprovePayoutResponse);
  rpc GetPayout(GetPayoutRequest) returns (GetPayoutResponse);
}
