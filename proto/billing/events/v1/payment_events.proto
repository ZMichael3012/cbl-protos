syntax = "proto3";

package billing.events.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/events/v1;eventsv1";

// PaymentEventType describes payment lifecycle event types.
enum PaymentEventType {
  PAYMENT_EVENT_TYPE_UNSPECIFIED = 0;
  PAYMENT_EVENT_TYPE_CREATED = 1;
  PAYMENT_EVENT_TYPE_DETECTED = 2;
  PAYMENT_EVENT_TYPE_CONFIRMING = 3;
  PAYMENT_EVENT_TYPE_COMPLETED = 4;
  PAYMENT_EVENT_TYPE_EXPIRED = 5;
  PAYMENT_EVENT_TYPE_UNDERPAID = 6;
  PAYMENT_EVENT_TYPE_OVERPAID = 7;
  PAYMENT_EVENT_TYPE_FAILED = 8;
}

// PaymentEvent describes a payment event for the payment.events topic.
// occurred_at in the body is the state transition time (authoritative); the
// envelope header must mirror it. state_version is a monotonic counter of
// payment transitions (owner: Payment, 4.1); consumers discard stale versions.
message PaymentEvent {
  string payment_id = 1;
  string merchant_id = 2;
  PaymentEventType type = 3;
  billing.common.v1.Money expected_amount = 4;
  billing.common.v1.Money received_amount = 5;
  billing.common.v1.Money fee = 6;
  string quote_id = 7;
  string rate = 8;
  string txid = 9;
  uint64 state_version = 10;
  google.protobuf.Timestamp occurred_at = 11;
  // Provider specifies the gateway provider id (additive CF-4): reporting
  // fact_* and reconciliation attribute events by it.
  string provider = 12;
  // RawStatus keeps the provider status string untouched (additive CF-4).
  string raw_status = 13;
  // GatewayFee, NetworkFee and FxSpread split fee = 6 into components
  // (COMMON-5, additive CF-4). A zero component means the provider did not
  // report it separately, for example an estimated fee before settlement.
  billing.common.v1.Money gateway_fee = 14;
  billing.common.v1.Money network_fee = 15;
  billing.common.v1.Money fx_spread = 16;
}
