syntax = "proto3";

package billing.events.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/events/v1;eventsv1";

// WebhookSignatureState describes the result of the provider webhook
// verification strategy (additive CF-4; the strategies are defined in CBL-003
// section 4).
enum WebhookSignatureState {
  WEBHOOK_SIGNATURE_STATE_UNSPECIFIED = 0;
  // Verified means the signature or token matched (HMAC or token echo).
  WEBHOOK_SIGNATURE_STATE_VERIFIED = 1;
  // HmacFailed means a present signature did not match (RawHMAC or
  // CanonicalJSONHMAC).
  WEBHOOK_SIGNATURE_STATE_HMAC_FAILED = 2;
  // EchoMismatch means the CoinGate token did not match the stored one.
  WEBHOOK_SIGNATURE_STATE_ECHO_MISMATCH = 3;
  // Absent means the request carried no verifiable signature.
  WEBHOOK_SIGNATURE_STATE_ABSENT = 4;
}

// GatewayWebhookRaw describes the raw provider webhook before normalization.
message GatewayWebhookRaw {
  string provider = 1;
  string gateway_id = 2;
  google.protobuf.Timestamp received_at = 3;
  map<string, string> headers = 4;
  bytes raw_body = 5;
  // SignatureVerified is deprecated by CF-4: use signature_state. It stays
  // populated during the transition of the ingress and connector (17.2, 17.4)
  // as signature_state == WEBHOOK_SIGNATURE_STATE_VERIFIED.
  bool signature_verified = 6 [deprecated = true];
  // SignatureState is the verification strategy result (additive CF-4). A
  // consumer must trust only VERIFIED deliveries and must fail closed: no
  // canonical event is published for any other state. UNSPECIFIED means a
  // producer that has not migrated yet: consumers fall back to
  // signature_verified until the 17.4 cutover, after which the fallback is
  // removed. Unverified deliveries are published for observability with a
  // random event_id, so they cannot poison the deterministic dedup key of the
  // genuine delivery.
  WebhookSignatureState signature_state = 7;
  // FetchRequired tells the connector to re-check the payment at the provider
  // before publishing a canonical event. It is mandatory for CoinGate and
  // BitPay regardless of this flag: on a mismatch the raw event goes to the
  // DLQ, on a fetch failure it is retried and never published unchecked
  // (additive CF-4).
  bool fetch_required = 8;
}

// CanonicalPaymentEventType describes the canonical payment events from the gateway.
enum CanonicalPaymentEventType {
  CANONICAL_PAYMENT_EVENT_TYPE_UNSPECIFIED = 0;
  CANONICAL_PAYMENT_EVENT_TYPE_DETECTED = 1;
  CANONICAL_PAYMENT_EVENT_TYPE_CONFIRMED = 2;
  CANONICAL_PAYMENT_EVENT_TYPE_FAILED = 3;
  CANONICAL_PAYMENT_EVENT_TYPE_EXPIRED = 4;
  CANONICAL_PAYMENT_EVENT_TYPE_UNDERPAID = 5;
  CANONICAL_PAYMENT_EVENT_TYPE_OVERPAID = 6;
}

// CanonicalPaymentEvent describes the normalized payment event from the gateway.
message CanonicalPaymentEvent {
  string payment_id = 1;
  string gateway_id = 2;
  string provider = 3;
  CanonicalPaymentEventType type = 4;
  billing.common.v1.Money received_amount = 5;
  uint32 confirmations = 6;
  string txid = 7;
  string network = 8;
  google.protobuf.Timestamp gateway_event_ts = 9;
  // RawStatus keeps the provider status string untouched (additive CF-4).
  string raw_status = 10;
  // GatewayFee, NetworkFee and FxSpread carry the provider fee split
  // (COMMON-5, additive cf-4.1): non-negative, in the same asset and decimals
  // as received_amount; a zero component means the provider did not report it
  // separately. The consumer validates the values (17.10).
  billing.common.v1.Money gateway_fee = 11;
  billing.common.v1.Money network_fee = 12;
  billing.common.v1.Money fx_spread = 13;
}

// GatewayPayoutEventType describes the canonical payout events from the gateway.
enum GatewayPayoutEventType {
  GATEWAY_PAYOUT_EVENT_TYPE_UNSPECIFIED = 0;
  GATEWAY_PAYOUT_EVENT_TYPE_SUBMITTED = 1;
  GATEWAY_PAYOUT_EVENT_TYPE_CONFIRMED = 2;
  GATEWAY_PAYOUT_EVENT_TYPE_FAILED = 3;
}

// GatewayPayoutEvent describes the result of the external payout step.
message GatewayPayoutEvent {
  string payout_id = 1;
  string gateway_payout_id = 2;
  GatewayPayoutEventType type = 3;
  string txid = 4;
  billing.common.v1.Money fee = 5;
  string reason = 6;
  // Provider specifies the gateway provider id (additive CF-4): consumers of
  // gateway.payout.events attribute the external result by it (17.11).
  string provider = 7;
}
