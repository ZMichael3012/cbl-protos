syntax = "proto3";

package billing.events.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/events/v1;eventsv1";

// PayoutCommand describes a payout command in the payout.commands topic.
message PayoutCommand {
  string payout_id = 1;
  billing.common.v1.Money amount = 2;
  string network = 3;
  string address = 4;
  string idempotency_key = 5;
  // RefundInvoiceId specifies the source invoice of a refund (additive
  // cf-4.2): a non-empty value means the command pays out a refund and the
  // Connector resolves the original provider invoice by this payment id and
  // calls the provider refunds API instead of a payout (17.12).
  string refund_invoice_id = 6;
}

// PayoutEventType describes payout lifecycle event types.
enum PayoutEventType {
  PAYOUT_EVENT_TYPE_UNSPECIFIED = 0;
  PAYOUT_EVENT_TYPE_REQUESTED = 1;
  PAYOUT_EVENT_TYPE_APPROVED = 2;
  PAYOUT_EVENT_TYPE_COMPLETED = 3;
  PAYOUT_EVENT_TYPE_FAILED = 4;
  PAYOUT_EVENT_TYPE_COMPENSATED = 5;
  // Rejected specifies the operator veto on a payout (10.5, additive CF-3).
  PAYOUT_EVENT_TYPE_REJECTED = 6;
}

// PayoutEvent describes a payout event for the payout.events topic.
message PayoutEvent {
  string payout_id = 1;
  string merchant_id = 2;
  PayoutEventType type = 3;
  billing.common.v1.Money amount = 4;
  billing.common.v1.Money fee = 5;
  string txid = 6;
  string provider = 7;
  string failure_reason = 8;
  uint64 state_version = 9;
  google.protobuf.Timestamp occurred_at = 10;
  // RefundInvoiceId specifies the source refund invoice: a non-empty value
  // means the event belongs to a refund (Notification 8.x publishes refund.*).
  string refund_invoice_id = 11;
}
