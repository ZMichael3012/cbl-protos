syntax = "proto3";

package billing.events.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/events/v1;eventsv1";

// LedgerEventType describes ledger event types.
enum LedgerEventType {
  LEDGER_EVENT_TYPE_UNSPECIFIED = 0;
  LEDGER_EVENT_TYPE_TRANSACTION_POSTED = 1;
  LEDGER_EVENT_TYPE_RESERVE_CREATED = 2;
  LEDGER_EVENT_TYPE_RESERVE_COMMITTED = 3;
  LEDGER_EVENT_TYPE_RESERVE_RELEASED = 4;
}

// LedgerEntry describes an entry in a ledger event.
message LedgerEntry {
  string account_id = 1;
  billing.common.v1.Direction direction = 2;
  billing.common.v1.Money amount = 3;
}

// LedgerEvent describes a ledger event for the ledger.events topic.
// Semantics by type (CF-2): transaction.posted carries the full set of entries;
// reserve.created and reserve.released do not create postings (hold): entries
// is empty, transaction_id is empty, identification is by ref_type/ref_id and
// the operation amount through the ledger gRPC; reserve.committed carries
// balanced capture entries. occurred_at in the body is the event time; the
// envelope header mirrors it.
message LedgerEvent {
  string transaction_id = 1;
  LedgerEventType type = 2;
  string ref_type = 3;
  string ref_id = 4;
  repeated LedgerEntry entries = 5;
  google.protobuf.Timestamp occurred_at = 6;
}
