syntax = "proto3";

package billing.ledger.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/ledger/v1;ledgerv1";

// EntryInput describes an entry in a double-entry transaction input.
message EntryInput {
  string account_id = 1;
  billing.common.v1.Direction direction = 2;
  billing.common.v1.Money amount = 3;
}

// Entry describes a persisted entry.
message Entry {
  int64 entry_id = 1;
  string transaction_id = 2;
  string account_id = 3;
  billing.common.v1.Direction direction = 4;
  billing.common.v1.Money amount = 5;
  string ref_type = 6;
  string ref_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

// AccountBalance describes the available and reserved account balance.
message AccountBalance {
  string account_id = 1;
  billing.common.v1.Money available = 2;
  billing.common.v1.Money reserved = 3;
}

// ReserveStatus describes the reserve state.
enum ReserveStatus {
  RESERVE_STATUS_UNSPECIFIED = 0;
  RESERVE_STATUS_ACTIVE = 1;
  RESERVE_STATUS_COMMITTED = 2;
  RESERVE_STATUS_RELEASED = 3;
}

// PostTransactionRequest creates a balanced transaction.
message PostTransactionRequest {
  string idempotency_key = 1;
  string ref_type = 2;
  string ref_id = 3;
  repeated EntryInput entries = 4;
}

// PostTransactionResponse returns the transaction ID and balances after posting.
message PostTransactionResponse {
  string transaction_id = 1;
  repeated AccountBalance balances_after = 2;
}

// ReserveRequest creates a funds reserve on an account.
message ReserveRequest {
  string idempotency_key = 1;
  string account_id = 2;
  billing.common.v1.Money amount = 3;
  string ref_id = 4;
}

// ReserveResponse returns the reserve.
message ReserveResponse {
  string reserve_id = 1;
  ReserveStatus status = 2;
}

// CommitReserveRequest turns a reserve into a posting.
message CommitReserveRequest {
  string idempotency_key = 1;
  string reserve_id = 2;
}

// CommitReserveResponse returns the reserve state.
message CommitReserveResponse {
  string reserve_id = 1;
  ReserveStatus status = 2;
}

// ReleaseReserveRequest releases a reserve.
message ReleaseReserveRequest {
  string idempotency_key = 1;
  string reserve_id = 2;
  string reason = 3;
}

// ReleaseReserveResponse returns the reserve state.
message ReleaseReserveResponse {
  string reserve_id = 1;
  ReserveStatus status = 2;
}

// GetBalanceRequest requests an account balance.
message GetBalanceRequest {
  string account_id = 1;
}

// GetBalanceResponse returns the account balance.
message GetBalanceResponse {
  AccountBalance balance = 1;
}

// ListEntriesRequest requests an account or merchant statement with cursor
// pagination. Account_id or merchant_ref is provided (at least one):
// merchant_ref restricts the statement to the merchant's accounts of the chart
// of accounts (merchant and payout); an account_id outside this set is rejected
// as not found. The period filters by transaction time: period_from inclusive,
// period_to exclusive; unset bounds do not restrict.
message ListEntriesRequest {
  string account_id = 1;
  uint32 limit = 2;
  string cursor = 3;
  // MerchantRef specifies the filter by merchant accounts (additive cf-3.2, CBL-2.10).
  string merchant_ref = 4;
  // PeriodFrom specifies the lower period bound, inclusive.
  google.protobuf.Timestamp period_from = 5;
  // PeriodTo specifies the upper period bound, exclusive.
  google.protobuf.Timestamp period_to = 6;
}

// ListEntriesResponse returns a page of entries.
message ListEntriesResponse {
  repeated Entry entries = 1;
  string next_cursor = 2;
}

// MerchantAccount describes a merchant account with its balance for BFF statements.
message MerchantAccount {
  string account_id = 1;
  // Type specifies the chart-of-accounts type: merchant or payout.
  string type = 2;
  string asset = 3;
  uint32 decimals = 4;
  billing.common.v1.Money available = 5;
  billing.common.v1.Money reserved = 6;
}

// ListMerchantAccountsRequest requests merchant accounts with balances.
message ListMerchantAccountsRequest {
  // MerchantRef specifies the merchant business reference (required).
  string merchant_ref = 1;
}

// ListMerchantAccountsResponse returns merchant accounts ordered ascending by
// (asset, type); accounts without postings are returned with zero balances.
message ListMerchantAccountsResponse {
  repeated MerchantAccount accounts = 1;
}

// LedgerService maintains double entry, reserves and balances.
service LedgerService {
  rpc PostTransaction(PostTransactionRequest) returns (PostTransactionResponse);
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc CommitReserve(CommitReserveRequest) returns (CommitReserveResponse);
  rpc ReleaseReserve(ReleaseReserveRequest) returns (ReleaseReserveResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  // ListMerchantAccounts returns merchant accounts with balances (additive
  // cf-3.2, CBL-2.10; prerequisite 7.4 - balances and account ownership for the BFF).
  rpc ListMerchantAccounts(ListMerchantAccountsRequest) returns (ListMerchantAccountsResponse);
}
