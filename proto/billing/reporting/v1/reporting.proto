syntax = "proto3";

package billing.reporting.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/reporting/v1;reportingv1";

// QueryRequest описывает запрос отчета из ClickHouse.
message QueryRequest {
  string report_type = 1;
  string merchant_id = 2;
  google.protobuf.Timestamp period_from = 3;
  google.protobuf.Timestamp period_to = 4;
  string group_by = 5;
  uint32 limit = 6;
  string cursor = 7;
}

// ReportRow описывает строку отчета: деньги и суммы передаются строками.
message ReportRow {
  map<string, string> values = 1;
}

// QueryResponse возвращает страницу отчета.
message QueryResponse {
  repeated ReportRow rows = 1;
  string next_cursor = 2;
}

// ReportingService отдает отчеты по данным ClickHouse.
service ReportingService {
  rpc Query(QueryRequest) returns (QueryResponse);
}
