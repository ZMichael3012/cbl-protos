syntax = "proto3";

package billing.payment.v1;

import "billing/common/v1/money.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/cbl/cbl-protos/gen/go/billing/payment/v1;paymentv1";

// PaymentState describes payment state machine states.
enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  PAYMENT_STATE_CREATING = 1;
  PAYMENT_STATE_CREATED = 2;
  PAYMENT_STATE_PENDING = 3;
  PAYMENT_STATE_DETECTED = 4;
  PAYMENT_STATE_CONFIRMING = 5;
  PAYMENT_STATE_COMPLETED = 6;
  PAYMENT_STATE_EXPIRED = 7;
  PAYMENT_STATE_UNDERPAID = 8;
  PAYMENT_STATE_OVERPAID = 9;
  PAYMENT_STATE_FAILED = 10;
  PAYMENT_STATE_CANCELLED = 11;
}

// TimelineItem describes one payment state history record.
message TimelineItem {
  PaymentState state = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string comment = 3;
}

// Payment describes a payment and its current state. expected_amount carries
// the payment amount and asset: the merchant invoice REST fields pay_amount and
// pay_asset are derived from it; rate and locked_until describe the locked rate
// quote (filled by 4.2 in creating/created; REST quote{rate, locked_until}).
message Payment {
  string payment_id = 1;
  string merchant_id = 2;
  PaymentState state = 3;
  billing.common.v1.Money expected_amount = 4;
  billing.common.v1.Money received_amount = 5;
  string pay_address = 6;
  string network = 7;
  string quote_id = 8;
  uint64 state_version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;
  repeated TimelineItem timeline = 12;
  // Rate specifies the locked rate as a decimal string (additive cf-3.3).
  string rate = 13;
  // LockedUntil specifies the quote lock deadline (additive cf-3.3).
  google.protobuf.Timestamp locked_until = 14;
  // Txid specifies the network transaction hash (additive cf-3.4).
  string txid = 15;
  // Confirmations specifies the number of network confirmations (additive cf-3.4).
  uint32 confirmations = 16;
  // CheckoutUrl specifies the hosted payment page of hosted providers; empty
  // means the address flow is used (additive CF-4). Exactly one of pay_address
  // and checkout_url is filled.
  string checkout_url = 17;
  // Provider specifies the gateway provider id (additive CF-4).
  string provider = 18;
  // RawStatus keeps the provider status string untouched (additive CF-4).
  string raw_status = 19;
}

// CreatePaymentRequest creates a payment and locks the rate quote.
message CreatePaymentRequest {
  string idempotency_key = 1;
  string merchant_id = 2;
  billing.common.v1.Money amount = 3;
  string pay_asset = 4;
  string network = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// CreatePaymentResponse returns the created payment and payment details.
message CreatePaymentResponse {
  string payment_id = 1;
  PaymentState state = 2;
  string pay_address = 3;
  string quote_id = 4;
  google.protobuf.Timestamp expires_at = 5;
  // Rate specifies the locked rate as a decimal string (additive cf-3.3).
  string rate = 6;
  // LockedUntil specifies the quote lock deadline (additive cf-3.3).
  google.protobuf.Timestamp locked_until = 7;
  // ExpectedAmount specifies the locked payment amount and asset (additive
  // cf-3.4): the source of pay_amount/pay_asset in the 201 merchant invoice
  // response, 7.4.
  billing.common.v1.Money expected_amount = 8;
  // CheckoutUrl specifies the hosted payment page (additive CF-4); exactly one
  // of pay_address and checkout_url is filled.
  string checkout_url = 9;
}

// GetPaymentRequest requests a payment by identifier.
message GetPaymentRequest {
  string payment_id = 1;
}

// GetPaymentResponse returns the payment with its state history.
message GetPaymentResponse {
  Payment payment = 1;
}

// ListPaymentsRequest requests a page of payments with cursor pagination.
// merchant_id is required (owner from the token); created_from and created_to
// filter by creation time (from inclusive, to exclusive; unset bounds do not
// restrict); cursor is the opaque next_cursor value from the previous response
// (order created_at DESC, id DESC).
message ListPaymentsRequest {
  string merchant_id = 1;
  PaymentState state_filter = 2;
  uint32 limit = 3;
  string cursor = 4;
  // CreatedFrom specifies the lower period bound, inclusive (additive cf-3.3).
  google.protobuf.Timestamp created_from = 5;
  // CreatedTo specifies the upper period bound, exclusive (additive cf-3.3).
  google.protobuf.Timestamp created_to = 6;
}

// ListPaymentsResponse returns a page of payments.
message ListPaymentsResponse {
  repeated Payment payments = 1;
  string next_cursor = 2;
}

// CancelPaymentRequest cancels a payment before payment detection.
message CancelPaymentRequest {
  string payment_id = 1;
  string idempotency_key = 2;
}

// CancelPaymentResponse returns the state of the cancelled payment.
message CancelPaymentResponse {
  Payment payment = 1;
}

// PaymentService manages the payment lifecycle.
service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (GetPaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
}
