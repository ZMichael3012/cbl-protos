name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cbl-protos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.47.2
      - name: Buf lint
        run: buf lint
      - name: Buf breaking against the last freeze
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'cbl-protos@cf-*')
          echo "breaking against $tag"
          buf breaking --against ".git#tag=$tag"
      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate and verify the committed stubs
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run github.com/bufbuild/buf/cmd/buf@v1.47.2 generate
          git diff --exit-code -- gen/
      - name: Build
        run: go build ./...
      - name: Contract tests
        run: go test -count=1 ./...
