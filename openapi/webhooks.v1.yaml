openapi: 3.1.0
info:
  title: CBL Webhook Delivery (Notification -> merchant)
  version: 1.0.0-cf3
  description: >
    Delivery contract of signed webhooks to the merchant by the Notification
    service. The composition and data schemas were frozen by CF-3 (after the
    freeze only backward-compatible clarifications are allowed); the
    implementation is tasks 8.1 - 8.3, the merchant documentation is 15.4.
    URL registration and signing secret issuance are
    POST /v1/webhook-endpoints (billing.v1.yaml, frozen by CF-2; the secret is
    shown once).

    Signature: X-Billing-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256(secret,
    t + "." + body)>, where body is the raw request body, hex in lowercase;
    verification is performed over the raw body, the comparison is
    constant-time. The secret is at least 32 random CSPRNG bytes, passed as a
    hex-encoded string, is never logged and never appears in URLs. The merchant
    checks t within a +/- 5 minute window (replay protection) and deduplicates
    deliveries by the body id, matching it against X-Billing-Event-Id: all
    retries of one delivery carry unchanged id and X-Billing-Event-Id (only t
    changes). An unknown type must be accepted (2xx) and ignored by the
    merchant: the type catalog is extended backward-compatibly.

    Success is any 2xx response (3xx and others do not count as success); the
    response body is not interpreted. The guarantee is at-least-once: the
    attempt timeout is 10 s, retries follow the schedule 1 s, 5 s, 30 s, 2 min,
    15 min, 1 h; after exhaustion the delivery is marked failed and a manual
    retry is available (8.3). Delivery order for a single entity is not
    guaranteed: the merchant applies events based on the data. The current
    state of an entity is always available via the merchant REST API.
webhooks:
  merchantEvent:
    post:
      operationId: deliverMerchantEvent
      summary: Platform event to the registered merchant URL
      description: >
        The event type is set by the type field; the shape of data is the
        source object (invoice, payout or refund) with fields from the source
        event. Fields absent from the event (address, invoice lifetime, etc.)
        are obtained by the merchant via REST GET of the corresponding entity.
      parameters:
        - name: X-Billing-Signature
          in: header
          required: true
          description: >
            Scheme t=<unix>,v1=<hex HMAC-SHA256(secret, t + "." + body)>,
            hex in lowercase
          schema:
            type: string
            pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'
        - name: X-Billing-Event-Id
          in: header
          required: true
          description: >
            Event identifier, equal to the body id field and unchanged on
            retries
          schema:
            type: string
            pattern: '^evt_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        '2XX':
          description: Delivery accepted; the response body is not interpreted
components:
  schemas:
    WebhookEvent:
      oneOf:
        - $ref: '#/components/schemas/InvoiceEvent'
        - $ref: '#/components/schemas/PayoutEvent'
        - $ref: '#/components/schemas/RefundEvent'
      discriminator:
        propertyName: type
        mapping:
          invoice.detected: '#/components/schemas/InvoiceEvent'
          invoice.confirming: '#/components/schemas/InvoiceEvent'
          invoice.completed: '#/components/schemas/InvoiceEvent'
          invoice.expired: '#/components/schemas/InvoiceEvent'
          invoice.underpaid: '#/components/schemas/InvoiceEvent'
          invoice.overpaid: '#/components/schemas/InvoiceEvent'
          invoice.failed: '#/components/schemas/InvoiceEvent'
          payout.completed: '#/components/schemas/PayoutEvent'
          payout.failed: '#/components/schemas/PayoutEvent'
          refund.completed: '#/components/schemas/RefundEvent'
          refund.failed: '#/components/schemas/RefundEvent'
    EventEnvelope:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          pattern: '^evt_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Event UUIDv7 with the evt_ prefix; unchanged on retries
        type:
          type: string
          description: Event type from the CF-3 catalog
        created_at:
          type: string
          format: date-time
          description: Time the event occurred, RFC 3339, UTC
        data:
          type: object
          description: Source data; the shape depends on type
    Asset:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          description: Decimal string in asset units, float is forbidden
        currency:
          type: string
          description: Asset code, for example USDT
    InvoiceEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              enum:
                - invoice.detected
                - invoice.confirming
                - invoice.completed
                - invoice.expired
                - invoice.underpaid
                - invoice.overpaid
                - invoice.failed
            data:
              type: object
              required: [invoice]
              properties:
                invoice:
                  type: object
                  required: [id, status]
                  properties:
                    id:
                      type: string
                      description: Invoice identifier (payment_id)
                    status:
                      type: string
                      description: Invoice state corresponding to the event type
                    amount:
                      $ref: '#/components/schemas/Asset'
                    paid_amount:
                      $ref: '#/components/schemas/Asset'
                    fee:
                      $ref: '#/components/schemas/Asset'
                    rate:
                      type: string
                      description: Locked quote rate
                    txid:
                      type: string
                      description: On-chain transaction identifier
                    occurred_at:
                      type: string
                      format: date-time
    PayoutEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              enum:
                - payout.completed
                - payout.failed
            data:
              type: object
              required: [payout]
              properties:
                payout:
                  type: object
                  required: [id, status]
                  properties:
                    id:
                      type: string
                      description: Payout identifier
                    status:
                      type: string
                      enum: [completed, failed, compensated, rejected]
                      description: >
                        Terminal state derived from the event type: completed
                        yields completed; failed yields failed, compensated or
                        rejected (the exact state is in this field)
                    amount:
                      $ref: '#/components/schemas/Asset'
                    fee:
                      $ref: '#/components/schemas/Asset'
                    txid:
                      type: string
                    failure_reason:
                      type: string
                      description: Failure or compensation reason
                    occurred_at:
                      type: string
                      format: date-time
    RefundEvent:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          properties:
            type:
              enum:
                - refund.completed
                - refund.failed
            data:
              type: object
              required: [refund]
              properties:
                refund:
                  type: object
                  required: [id, status]
                  properties:
                    id:
                      type: string
                      description: Refund payout identifier (payout_id)
                    invoice_id:
                      type: string
                      description: Source invoice the refund is made for
                    status:
                      type: string
                      enum: [completed, failed, compensated, rejected]
                      description: >
                        Terminal state of the refund payout, derived from the
                        event type (as for payout)
                    amount:
                      $ref: '#/components/schemas/Asset'
                    fee:
                      $ref: '#/components/schemas/Asset'
                    txid:
                      type: string
                    failure_reason:
                      type: string
                    occurred_at:
                      type: string
                      format: date-time
