openapi: 3.1.0
info:
  title: CBL Billing API
  version: 1.0.0
  description: >
    Merchant API of the CBL crypto-billing platform. Final version 1.0.0 (task
    7.1; the draft was frozen by CF-2, webhook parts refined by CF-3; tag
    cbl-protos@cf-3.1). After finalization only backward-compatible changes are
    allowed (CBL-003, section 8); breaking changes go to /v2 and a new wave.

    Money is passed as a decimal string plus the asset code; float is
    forbidden. All mutating calls require the Idempotency-Key header: the key
    is scoped by the merchant from the token; a replay with the same body
    returns the original response (Idempotent-Replayed: true), and the same
    key with a different body returns 409 idempotency_key_reuse. The request
    fingerprint is the method, the path and the raw body hash; only successful
    responses are cached (errors do not occupy the key); the retention window
    is 24 hours (CBL-003, section 7). All resources are scoped by the merchant
    from the bearer token: merchant_id is not accepted in requests. Errors use
    application/problem+json (RFC 9457); 429 and 503 carry Retry-After.
servers:
  - url: https://billing.example.com/v1
    description: Perimeter (API Gateway)
tags:
  - name: invoices
  - name: payouts
  - name: refunds
  - name: balances
  - name: ledger
  - name: reports
  - name: webhooks
security:
  - bearerAuth: []
paths:
  /invoices:
    post:
      tags: [invoices]
      operationId: createInvoice
      summary: Create an invoice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
      responses:
        '201':
          description: >
            The invoice is created; an idempotency key replay returns the
            original response. The status may be creating (the quote is locked,
            the address is expected): the pay_address, pay_amount and quote
            fields are populated asynchronously; the merchant polls
            GET /invoices/{id}
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [invoices]
      operationId: listInvoices
      summary: List invoices
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: merchant_order_id
          in: query
          schema:
            type: string
            maxLength: 128
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /invoices/{id}:
    get:
      tags: [invoices]
      operationId: getInvoice
      summary: Invoice status
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /invoices/{id}/cancel:
    post:
      tags: [invoices]
      operationId: cancelInvoice
      summary: Cancel an invoice before payment detection
      description: >
        Empty body. 409 (invoice_not_cancellable) if the invoice is already
        detected or terminal. A replay with the same Idempotency-Key returns
        the original response.
      parameters:
        - $ref: '#/components/parameters/ResourceID'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The invoice is cancelled
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payouts:
    post:
      tags: [payouts]
      operationId: createPayout
      summary: Create a payout
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
      responses:
        '201':
          description: The payout is created
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payouts/{id}:
    get:
      tags: [payouts]
      operationId: getPayout
      summary: Payout status
      parameters:
        - $ref: '#/components/parameters/ResourceID'
      responses:
        '200':
          description: Payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /refunds:
    post:
      tags: [refunds]
      operationId: createRefund
      summary: Create a refund for a confirmed invoice
      description: >
        Executed as a refund payout (a Payout with the refund_invoice_id
        marker, CBL-10.6); the refund status is read via GET /payouts/{id}
        with the refund id.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreateRequest'
      responses:
        '201':
          description: The refund is created
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /balances:
    get:
      tags: [balances]
      operationId: getBalances
      summary: Merchant balances by asset
      responses:
        '200':
          description: Balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ledger/entries:
    get:
      tags: [ledger]
      operationId: listLedgerEntries
      summary: Statement of ledger entries
      parameters:
        - name: account_id
          in: query
          schema:
            type: string
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: >
            Account within the merchant from the token; server-side owner
            verification is mandatory (7.4; an additive Ledger extension is
            required, task 2.10); an account of another merchant or an unknown
            account returns 404; account_id is deterministic and is not a
            secret. If not set, all merchant accounts
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /reports/{report_type}:
    get:
      tags: [reports]
      operationId: getReport
      summary: Report from ClickHouse (merchant_id is taken from the token)
      parameters:
        - name: report_type
          in: path
          required: true
          schema:
            type: string
          description: >
            Report type from the 11.4 catalog (additive); an unknown type
            returns 404 unknown_report_type
        - name: period_from
          in: query
          schema:
            type: string
            format: date-time
        - name: period_to
          in: query
          schema:
            type: string
            format: date-time
        - name: group_by
          in: query
          schema:
            type: string
            maxLength: 64
          description: >
            Grouping dimension from the 11.4 catalog whitelist; the server must
            use only parameterized ClickHouse queries
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /webhook-endpoints:
    post:
      tags: [webhooks]
      operationId: registerWebhookEndpoint
      summary: Register a webhook URL (the secret is shown once)
      description: >
        Registering a URL that is already active for the merchant returns 409
        webhook_endpoint_exists. A replay of the request with the same
        Idempotency-Key returns the original response (including
        signing_secret).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointRequest'
      responses:
        '201':
          description: The endpoint is registered
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Merchant API key; issuance, rotation and revocation are outside the
        merchant API (7.2, 12.x). The key is verified at the perimeter (API
        Gateway) and again in the BFF; all resources are scoped by the token
        subject
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._~-]+$'
      description: >
        Request idempotency key; scoped by the merchant from the token. The
        fingerprint is the method, the path and the raw body hash; a replay
        with the same fingerprint returns the original response
        (Idempotent-Replayed); the same key with a different fingerprint
        returns 409 idempotency_key_reuse. Only successful responses are
        cached; the retention window is 24 hours
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Resource identifier (UUIDv7)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
  headers:
    IdempotentReplayed:
      description: >
        Indicates a replay of a previously stored response; the header is
        absent on the first successful response
      schema:
        type: string
        enum: ["true"]
    RetryAfter:
      description: Seconds until the next retry attempt
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequest:
      description: Request format error (problem+json, RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The merchant API key is missing or invalid
      headers:
        WWW-Authenticate:
          description: Authentication scheme (RFC 6750)
          schema:
            type: string
            enum: ['Bearer realm="billing"']
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The action is forbidden for the merchant (for example, suspended)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: >
        The resource is not found or does not belong to the merchant (foreign
        identifiers are not disclosed)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >
        State or idempotency key conflict (codes idempotency_key_reuse,
        invoice_not_cancellable, webhook_endpoint_exists and others)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: >
        Business validation (insufficient funds, the invoice is not completed,
        an unknown event type and others; code specifies the reason)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The merchant rate limit is exceeded
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >
        Temporary unavailability of a dependency; code specifies:
        provider_unavailable (external gateway) or service_unavailable
        (internal service: Payment, Ledger, Payout, Reporting, Notification)
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: >
            Machine-readable reason code: idempotency_key_reuse,
            invoice_not_cancellable, webhook_endpoint_exists,
            unknown_report_type, insufficient_funds, validation_failed,
            provider_unavailable, service_unavailable, rate_limited; the list
            is additive
        detail:
          type: string
          description: >
            Human-readable explanation; contains no secrets, personal data or
            internal details; request_id is used for correlation
        request_id:
          type: string
          description: Request identifier for correlation with logs and tracing
    Money:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      maxLength: 40
      description: >
        Decimal string in asset units, float is forbidden; non-negative; for
        operation amounts server-side validation requires a value greater than
        zero
      examples: ["100.50"]
    Asset:
      type: object
      required: [amount, currency]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          examples: [USDT]
    Quote:
      type: object
      required: [rate, locked_until]
      properties:
        rate:
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
          maxLength: 40
          description: Quote rate as a decimal string (no exponent)
        locked_until:
          type: string
          format: date-time
    TimelineItem:
      type: object
      required: [state, occurred_at]
      properties:
        state:
          $ref: '#/components/schemas/InvoiceStatus'
        occurred_at:
          type: string
          format: date-time
    InvoiceStatus:
      type: string
      x-extensible-enum: [creating, created, pending, detected, confirming, completed, expired, underpaid, overpaid, failed, cancelled]
      description: >
        Invoice state; the list is extensible: the client must handle unknown
        values correctly (for example, display them as is)
    Invoice:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Invoice identifier (UUIDv7)
        merchant_order_id:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        amount:
          $ref: '#/components/schemas/Asset'
        pay_amount:
          $ref: '#/components/schemas/Asset'
        pay_address:
          type: string
        network:
          type: string
        paid_amount:
          $ref: '#/components/schemas/Asset'
        confirmations:
          type: integer
        txid:
          type: string
        quote:
          $ref: '#/components/schemas/Quote'
        expires_at:
          type: string
          format: date-time
        checkout_url:
          type: string
          format: uri
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineItem'
        metadata:
          type: object
          additionalProperties:
            type: string
    InvoiceCreateRequest:
      type: object
      additionalProperties: false
      required: [merchant_order_id, amount, currency, pay_currency, network]
      properties:
        merchant_order_id:
          type: string
          maxLength: 128
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          description: Invoice currency (fiat or asset)
        pay_currency:
          type: string
          description: Payment asset from the gateway capabilities
        network:
          type: string
          description: Payment network (for example trc20, erc20)
        expires_in_sec:
          type: integer
          minimum: 60
          maximum: 86400
          description: Invoice lifetime; if not set, 900 seconds (15 minutes)
        metadata:
          type: object
          maxProperties: 32
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 512
    InvoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        next_cursor:
          type: string
    PayoutState:
      type: string
      x-extensible-enum: [requested, approved, reserved, sent_to_gateway, completed, failed, compensated, rejected]
      description: >
        Payout state; the list is extensible: the client must handle unknown
        values correctly
    Payout:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Payout identifier (UUIDv7)
        status:
          $ref: '#/components/schemas/PayoutState'
        amount:
          $ref: '#/components/schemas/Asset'
        fee:
          $ref: '#/components/schemas/Asset'
        network:
          type: string
        destination_address:
          type: string
        txid:
          type: string
        failure_reason:
          type: string
        invoice_id:
          type: string
          description: >
            Source invoice of the refund; populated only for refund payouts
            (refund_invoice_id), empty for regular payouts
        created_at:
          type: string
          format: date-time
    PayoutCreateRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, network, destination_address]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        network:
          type: string
        destination_address:
          type: string
          description: Destination address in the specified network
        merchant_ref:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: Business key of the merchant account plan (CBL-003, section 9)
    RefundCreateRequest:
      type: object
      additionalProperties: false
      required: [invoice_id, amount, destination_address]
      properties:
        invoice_id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Source invoice the refund is made for
        amount:
          $ref: '#/components/schemas/Money'
        destination_address:
          type: string
        currency:
          type: string
          description: Refund asset; if not set, derived from the source invoice (7.4)
        network:
          type: string
          description: Refund network; if not set, derived from the source invoice (7.4)
    Refund:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          description: Refund payout identifier
        invoice_id:
          type: string
          description: Source invoice the refund is made for
        status:
          $ref: '#/components/schemas/PayoutState'
        amount:
          $ref: '#/components/schemas/Asset'
    BalanceItem:
      type: object
      required: [currency, available]
      properties:
        currency:
          type: string
        available:
          $ref: '#/components/schemas/Money'
        reserved:
          $ref: '#/components/schemas/Money'
        pending:
          $ref: '#/components/schemas/Money'
          description: >
            Funds awaiting credit (payments in detected/confirming states);
            the source is Payment aggregation, not Ledger (7.4)
    BalanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BalanceItem'
    LedgerEntry:
      type: object
      required: [entry_id, account_id, direction, amount]
      properties:
        entry_id:
          type: integer
          format: int64
        account_id:
          type: string
        direction:
          type: string
          x-extensible-enum: [debit, credit]
          description: Entry direction; the list is extensible
        amount:
          $ref: '#/components/schemas/Asset'
        ref_type:
          type: string
        ref_id:
          type: string
        created_at:
          type: string
          format: date-time
    LedgerEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        next_cursor:
          type: string
    ReportPage:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
            description: >
              Row column values; money and rates are decimal strings in
              canonical form (no exponent, float is forbidden)
        next_cursor:
          type: string
    WebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://[^\s@\\]+$'
          maxLength: 2048
          description: >
            HTTPS only, without userinfo or IP literals; the platform SSRF
            protection is applied on every delivery attempt: resolution of all
            A/AAAA records, range checks (IPv4
            private/loopback/link-local/metadata 169.254.0.0/16, 0.0.0.0/8,
            100.64.0.0/10; IPv6 ::1, fc00::/7, fe80::/10, IPv4-mapped),
            connection to the verified address without following redirects
            (DNS-rebinding protection)
        events:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            enum:
              - invoice.detected
              - invoice.confirming
              - invoice.completed
              - invoice.expired
              - invoice.underpaid
              - invoice.overpaid
              - invoice.failed
              - payout.completed
              - payout.failed
              - refund.completed
              - refund.failed
          description: >
            Types from the CF-3 catalog (openapi/webhooks.v1.yaml): delivery is
            filtered by the list; an unknown type returns 422. New catalog
            types are added backward-compatibly (cf-N.x) and are not included
            in the subscription automatically: re-registration is required
    WebhookEndpointResponse:
      type: object
      required: [id, url, events]
      properties:
        id:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        signing_secret:
          type: string
          minLength: 64
          description: >
            Signing secret: at least 32 random CSPRNG bytes in hex encoding.
            It is returned in the original registration response and its
            idempotent replay; subsequent reads do not return the secret, and
            it never appears in logs or URLs. Rotation is 8.1/13.2
