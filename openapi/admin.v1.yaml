openapi: 3.1.0
info:
  title: CBL Back-office API
  version: 1.0.0
  description: >
    Admin API of the CBL platform for operators: payout approval, provider
    routing, discrepancy handling, operator action journal. Authentication is a
    bearer token of the operator; RBAC and audit are on the cbl-backoffice side
    (12.1): every mutating action writes an append-only audit log record (who,
    what, before/after), readable through GET /audit-log.
servers:
  - url: https://admin.example.com/admin/v1
tags:
  - name: payouts
  - name: routing
  - name: reconciliation
  - name: providers
  - name: audit
security:
  - bearerAuth: []
paths:
  /payouts/{id}/approve:
    post:
      tags: [payouts]
      operationId: approvePayout
      summary: Approve a large payout (by the threshold policy, two operators by default)
      description: >
        The number of votes follows the approval threshold policy (two
        different operators by default); a second vote by the same operator
        returns 409 (a vote is immutable). The acting subject is derived from
        the bearer token: the operator in the token and the body operator_id
        must match, otherwise 403; the audit is recorded against the token
        subject.
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutDecisionRequest'
      responses:
        '200':
          description: The decision is accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payouts/{id}/reject:
    post:
      tags: [payouts]
      operationId: rejectPayout
      summary: Reject a large payout
      description: >
        Veto: a single rejection is enough for the payout to move to rejected;
        the reason field is required and must not be empty. The acting subject
        is derived from the bearer token: the operator in the token and the
        body operator_id must match, otherwise 403.
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutDecisionRequest'
      responses:
        '200':
          description: The decision is accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          description: >
            Business validation: the reject reason is required and must not be
            empty
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /routing-rules:
    get:
      tags: [routing]
      operationId: listRoutingRules
      summary: Provider routing rules
      responses:
        '200':
          description: Current revision of the rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleSet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [routing]
      operationId: putRoutingRules
      summary: Replace routing rules (full revision replacement)
      description: >
        Replaces the rule set entirely. revision is the revision obtained from
        the last GET; a mismatch with the current one returns 409 (protection
        against a race between two operators). A separate RBAC role for routing
        management is required (12.1): the payout approval right does not grant
        the right to change routes. Application is asynchronous: the Connector
        routing cache is refreshed within 30 - 60 s (CBL-003 section 7).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingRuleSet'
      responses:
        '200':
          description: The new rules revision is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /reconciliation/discrepancies:
    get:
      tags: [reconciliation]
      operationId: listDiscrepancies
      summary: Reconciliation discrepancies
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, critical]
        - name: merchant_id
          in: query
          schema:
            type: string
          description: Filter by merchant (empty means system and all other discrepancies)
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of discrepancies
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discrepancy'
                  next_cursor:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /reconciliation/discrepancies/{id}/resolve:
    post:
      tags: [reconciliation]
      operationId: resolveDiscrepancy
      summary: Resolve a discrepancy manually
      description: >
        Resolving an already resolved discrepancy again returns 409. The
        acting subject is derived from the bearer token: the operator in the
        token and the body operator_id must match, otherwise 403. Execution of
        manual adjustments (manual_adjustment) is task 12.3.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyResolveRequest'
      responses:
        '200':
          description: The discrepancy is resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discrepancy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /providers/{id}/disable:
    post:
      tags: [providers]
      operationId: disableProvider
      summary: Disable a provider manually
      description: >
        Disabling an already disabled provider is idempotent: 204 without a
        new audit record. The reason is optional.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        '204':
          description: The provider is disabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /providers/{id}/enable:
    post:
      tags: [providers]
      operationId: enableProvider
      summary: Enable a provider disabled before
      description: >
        Enabling an already enabled provider is idempotent: 204 without a new
        audit record. The reason is optional. The provider is removed from the
        disabled set; the router may select it again subject to the circuit
        breaker state and the configuration cache refresh (up to 60 s).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
      responses:
        '204':
          description: The provider is enabled
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /audit-log:
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: Operator action journal (append-only audit log)
      description: >
        Pages of immutable audit records, newest first (occurred_at and id
        descending). The cursor is opaque and bound to the filter set; an
        invalid cursor or period returns 400. Records are written by mutating
        admin actions; this read route writes nothing.
      parameters:
        - name: operator_id
          in: query
          schema:
            type: string
          description: Filter by the acting operator (exact match)
        - name: action
          in: query
          schema:
            type: string
          description: Filter by the action name (exact match)
        - name: period_from
          in: query
          schema:
            type: string
            format: date-time
          description: Lower bound of occurred_at, inclusive (RFC 3339, UTC)
        - name: period_to
          in: query
          schema:
            type: string
            format: date-time
          description: Upper bound of occurred_at, inclusive (RFC 3339, UTC)
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of audit records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRecord'
                  next_cursor:
                    type: string
                    description: Opaque cursor of the next page; empty at the end
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator token with RBAC
  parameters:
    PayoutID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Problem:
      description: Error in the application/problem+json format (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: Request format error (application/problem+json, RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: The operator token is missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient RBAC rights for the action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: >
        The service or its storage is temporarily unavailable; retry after the
        delay from the Retry-After header
      headers:
        Retry-After:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
    PayoutDecisionRequest:
      type: object
      additionalProperties: false
      required: [operator_id]
      properties:
        operator_id:
          type: string
          description: >
            Identifier of the operator voting for the decision; must match the
            bearer token subject, otherwise 403 (the audit is recorded against
            the token subject)
        reason:
          type: string
          description: Required and non-empty for reject (otherwise 422)
    PayoutAdmin:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        approved_by:
          type: array
          items:
            type: string
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
    Money:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: Decimal string in asset units, float is forbidden
    RoutingRuleSet:
      type: object
      additionalProperties: false
      required: [revision, items]
      properties:
        revision:
          type: integer
          format: int64
          description: >
            Set revision; on PUT it is the revision obtained from the last
            GET, otherwise 409
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RoutingRule'
    RoutingRule:
      type: object
      additionalProperties: false
      required: [provider, priority, enabled]
      properties:
        provider:
          type: string
        operation:
          type: string
          enum: ["", invoice, payout]
          description: Empty means any operation
        networks:
          type: array
          items:
            type: string
          description: Empty means any network
        assets:
          type: array
          items:
            type: string
          description: Empty means any asset
        priority:
          type: integer
          minimum: 0
        weight:
          type: integer
          minimum: 1
        min_amount:
          type: integer
          format: int64
          minimum: 0
          description: Lower bound in minor units of the asset; 0 means no bound
        max_amount:
          type: integer
          format: int64
          minimum: 0
          description: Upper bound in minor units of the asset; 0 means no bound
        enabled:
          type: boolean
    Discrepancy:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [missing_in_ledger, amount_mismatch, status_mismatch]
        ref_id:
          type: string
          description: Identifier of the discrepancy entity (payment_id/payout_id)
        merchant_id:
          type: string
          description: Merchant that owns the discrepancy; empty for system ones
        severity:
          type: string
          enum: [info, warning, critical]
        expected:
          type: string
        actual:
          type: string
        status:
          type: string
          enum: [open, resolved]
        created_at:
          type: string
          format: date-time
    DiscrepancyResolveRequest:
      type: object
      additionalProperties: false
      required: [operator_id, resolution]
      properties:
        operator_id:
          type: string
          description: >
            Operator identifier; must match the bearer token subject,
            otherwise 403 (the audit is recorded against the token subject)
        resolution:
          type: string
          enum: [confirm_platform, confirm_gateway, manual_adjustment]
        comment:
          type: string
    AuditRecord:
      type: object
      description: >
        One immutable entry of the operator action journal: who did what, with
        the state before and after. Records are never updated or deleted.
      properties:
        id:
          type: string
        occurred_at:
          type: string
          format: date-time
        operator_id:
          type: string
          description: Token subject of the acting operator
        action:
          type: string
          description: Action name, for example payout.approve or routing.update
        resource_type:
          type: string
        resource_id:
          type: string
        request_id:
          type: string
          description: Request identifier linking the record to the access log
        before:
          type: [object, 'null']
          description: State before the action (null for creations)
        after:
          type: [object, 'null']
          description: State after the action (null for deletions)
