openapi: 3.1.0
info:
  title: CBL Back-office API
  version: 1.0.0-draft
  description: >
    Admin API платформы CBL для операторов: утверждение выплат, маршрутизация
    провайдеров, работа с расхождениями. RBAC и аудит на стороне cbl-backoffice.
    Черновик CF-3, финализируется задачей 12.1.
servers:
  - url: https://admin.example.com/admin/v1
tags:
  - name: payouts
  - name: routing
  - name: reconciliation
  - name: providers
security:
  - bearerAuth: []
paths:
  /payouts/{id}/approve:
    post:
      tags: [payouts]
      operationId: approvePayout
      summary: Подтвердить крупную выплату (по порогу, двумя операторами)
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutDecisionRequest'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAdmin'
        '409':
          $ref: '#/components/responses/Problem'
  /payouts/{id}/reject:
    post:
      tags: [payouts]
      operationId: rejectPayout
      summary: Отклонить крупную выплату
      parameters:
        - $ref: '#/components/parameters/PayoutID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutDecisionRequest'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAdmin'
        '409':
          $ref: '#/components/responses/Problem'
  /routing-rules:
    get:
      tags: [routing]
      operationId: listRoutingRules
      summary: Правила маршрутизации провайдеров
      responses:
        '200':
          description: Список правил
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoutingRule'
    put:
      tags: [routing]
      operationId: putRoutingRules
      summary: Заменить правила маршрутизации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/RoutingRule'
      responses:
        '200':
          description: Правила сохранены
  /reconciliation/discrepancies:
    get:
      tags: [reconciliation]
      operationId: listDiscrepancies
      summary: Расхождения сверки
      parameters:
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, warning, critical]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница расхождений
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Discrepancy'
                  next_cursor:
                    type: string
  /reconciliation/discrepancies/{id}/resolve:
    post:
      tags: [reconciliation]
      operationId: resolveDiscrepancy
      summary: Разрешить расхождение вручную
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyResolveRequest'
      responses:
        '200':
          description: Расхождение разрешено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discrepancy'
  /providers/{id}/disable:
    post:
      tags: [providers]
      operationId: disableProvider
      summary: Отключить провайдера вручную
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '204':
          description: Провайдер отключен
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Токен оператора с RBAC
  parameters:
    PayoutID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
  responses:
    Problem:
      description: Ошибка в формате application/problem+json (RFC 9457)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
    PayoutDecisionRequest:
      type: object
      properties:
        operator_id:
          type: string
        reason:
          type: string
    PayoutAdmin:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        approved_by:
          type: array
          items:
            type: string
        amount:
          type: string
        currency:
          type: string
    RoutingRule:
      type: object
      properties:
        network:
          type: string
        asset:
          type: string
        provider:
          type: string
        priority:
          type: integer
        weight:
          type: integer
        min_amount:
          type: string
        max_amount:
          type: string
        enabled:
          type: boolean
    Discrepancy:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [missing_in_ledger, amount_mismatch, status_mismatch]
        ref_id:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]
        expected:
          type: string
        actual:
          type: string
        status:
          type: string
          enum: [open, resolved]
        created_at:
          type: string
          format: date-time
    DiscrepancyResolveRequest:
      type: object
      properties:
        operator_id:
          type: string
        resolution:
          type: string
          enum: [confirm_platform, confirm_gateway, manual_adjustment]
        comment:
          type: string
